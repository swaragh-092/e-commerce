services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env before starting Compose}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes: [pgdata:/var/lib/postgresql/data]
    # PostgreSQL is for local/container-network access only; do not expose it
    # on every host interface.
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: { context: ., dockerfile: server/Dockerfile }
    # Root .env is the single source of truth (server/index.js loads ../.env first).
    # ./server/.env does not exist locally, so referencing it breaks `docker compose up`.
    env_file: ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env before starting Compose}
    depends_on: { db: { condition: service_healthy } }
    volumes: [./server/uploads:/app/server/uploads]
    ports: ["127.0.0.1:5000:5000"]
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        ADMIN_ROUTE_PREFIX: ${ADMIN_ROUTE_PREFIX:-/api/admin}
        VITE_ADMIN_ROUTE_PREFIX: ${VITE_ADMIN_ROUTE_PREFIX:-}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_URL: ${VITE_APP_URL:-}
    ports: [80:80]
    depends_on: [server]
    restart: unless-stopped

volumes: { pgdata: }
