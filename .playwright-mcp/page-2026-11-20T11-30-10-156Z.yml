                - paragraph [ref=f1e4]: When you contact us or send an enquiry, you may provide your name, email address, telephone number and details of the varieties or quantities you are interested in. An order may also require billing and delivery information. Share only the information needed to handle your request.
                - heading "How information is used" [level=2] [ref=f1e5]
                - paragraph [ref=f1e6]: We use these details to respond to enquiries, communicate about requests and orders, and provide customer support. The website may use browser storage to remember items in an enquiry list or wishlist. If you subscribe to updates, use the unsubscribe option in the message or contact us to change your preference.
                - heading "Service providers" [level=2] [ref=f1e7]
                - paragraph [ref=f1e8]: Where needed to provide a service, relevant information may be shared with providers that help operate the website, deliver communications, process payments or deliver an order. For example, a carrier needs the delivery details for a shipment it handles.
