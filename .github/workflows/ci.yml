name: CI — Lint, Test & Build

on:
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: postgres
      DB_PASSWORD: testpass
      JWT_ACCESS_SECRET: ci-test-only-access-secret-00000000000000
      JWT_REFRESH_SECRET: ci-test-only-refresh-secret-0000000000000
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      CLIENT_URL: http://localhost:5173
      APP_MODE: ecommerce
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --run
      - run: npm run migrate
      - name: Verify server readiness
        shell: bash
        run: |
          node index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:5000/health >/dev/null 2>&1; then
              exit 0
            fi
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          echo "::error::Server did not pass its PostgreSQL-backed readiness check"
          exit 1

  frontend_shards:
    name: Frontend shard ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
        if: matrix.shard == 1
      - run: npm test -- --shard=${{ matrix.shard }}/2
      - run: npm run build
        if: matrix.shard == 1
        env:
          VITE_API_URL: /api

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: frontend_shards
    if: always()
    steps:
      - name: Require both frontend shards to pass
        env:
          SHARD_RESULT: ${{ needs.frontend_shards.result }}
        run: test "$SHARD_RESULT" = success
