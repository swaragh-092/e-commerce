name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-staging
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      TARGET: staging
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      APP_DIR: ${{ secrets.APP_DIR }}
      SITE_URL: ${{ vars.SITE_URL }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      WEB_ROOT: ${{ vars.WEB_ROOT }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure and verify SSH
        env:
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
          EXPECTED_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: bash ops/ec2-runner.sh configure

      - name: Read-only server preflight
        run: bash ops/ec2-runner.sh preflight

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: |
          read -r VITE_ADMIN_ROUTE_PREFIX < "$RUNNER_TEMP/ec2-ssh/admin_prefix"
          export VITE_ADMIN_ROUTE_PREFIX
          npm run build

      - name: Package frontend
        run: |
          test -s client/dist/index.html
          tar -czf "$RUNNER_TEMP/frontend.tar.gz" -C client/dist .

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-staging-${{ github.sha }}
          path: ${{ runner.temp }}/frontend.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Preflight only
        if: env.DEPLOY_ENABLED == 'false'
        run: echo "Build and read-only preflight passed. Deployment remains disabled."

      - name: Transfer and deploy
        if: env.DEPLOY_ENABLED == 'true'
        run: bash ops/ec2-runner.sh transfer

      - name: Cleanup runner SSH key
        if: always()
        run: bash ops/ec2-runner.sh cleanup
